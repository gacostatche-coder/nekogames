<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Neko Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra de demo arriba; debajo, la vista activa (directorio, super admin, tienda pública o panel de tienda). */
:root {
  --bg: #F3F3F0; --panel: #FFFFFF; --panel2: #EFEEE9; --line: #DCDAD2; --ink: #17181C; --ink2: #555A65;
  --brand: #0F6E66; --on-brand: #FFFFFF; --brand-soft: #DDEFEC;
  --ok: #1B7A43; --ok-bg: #E2F3E8; --warn: #8A5A00; --warn-bg: #FBF0D9; --bad: #B42318; --bad-bg: #FBE4E1;
  --demo: #17181C; --demo-ink: #E9EAEC; --demo-ink2: #A9AEB7;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111316; --panel: #1A1D21; --panel2: #23272C; --line: #343941; --ink: #ECEDEF; --ink2: #A8AEB7;
  --brand: #55C4B8; --on-brand: #0B1F1D; --brand-soft: #173431;
  --ok: #67CF93; --ok-bg: #16301F; --warn: #E8B551; --warn-bg: #33270F; --bad: #F2857A; --bad-bg: #3A1B18;
  --demo: #000000; --demo-ink: #E9EAEC; --demo-ink2: #A9AEB7; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111316; --panel: #1A1D21; --panel2: #23272C; --line: #343941; --ink: #ECEDEF; --ink2: #A8AEB7;
  --brand: #55C4B8; --on-brand: #0B1F1D; --brand-soft: #173431;
  --ok: #67CF93; --ok-bg: #16301F; --warn: #E8B551; --warn-bg: #33270F; --bad: #F2857A; --bad-bg: #3A1B18;
  --demo: #000000; --demo-ink: #E9EAEC; --demo-ink2: #A9AEB7; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -0.015em; text-wrap: balance; margin: 0; line-height: 1.15; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; }
.muted { color: var(--ink2); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Barra de demostración */
.demo { background: var(--demo); color: var(--demo-ink); font-size: 13px; }
.demo .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-block: 8px; }
.demo b { font-family: var(--f-mono); font-weight: 500; color: var(--demo-ink2); letter-spacing: .06em; text-transform: uppercase; font-size: 11px; margin-right: 4px; }
.demo button, .demo select { background: transparent; border: 1px solid #3A3F47; color: var(--demo-ink); border-radius: 999px; min-height: 34px; padding: 0 12px; }
.demo button[aria-pressed="true"] { background: var(--demo-ink); color: #111; border-color: var(--demo-ink); }
.demo select { background: #1E2126; }
.demo .sp { flex: 1; }
.demo .net { font-family: var(--f-mono); font-size: 11px; color: var(--demo-ink2); }

/* Controles genéricos (plataforma y paneles) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-weight: 600; text-decoration: none; }
.btn:hover { border-color: var(--ink2); }
.btn.pri { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 8px; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink2); font-weight: 500; }
.field input, .field select, .field textarea, .inp { min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font-size: 15px; font-weight: 400; width: 100%; }
.field textarea { min-height: 96px; resize: vertical; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.neu { background: var(--panel2); color: var(--ink2); }
.pill.brand { background: var(--brand-soft); color: var(--brand); }
.tbl-box { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 720px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: .05em; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel2); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }

/* Directorio y super admin */
.plat-hero { padding-block: 48px 24px; }
.plat-hero h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 800; max-width: 760px; }
.plat-hero p { max-width: 620px; font-size: 17px; }
.store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.store-tile { display: flex; flex-direction: column; gap: 14px; }
.logo { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 800; font-size: 17px; overflow: hidden; flex: none; }
.logo img { width: 100%; height: 100%; object-fit: contain; }
.login { max-width: 420px; margin: 64px auto; }
.hint { font-size: 13px; padding: 10px 12px; border-radius: 8px; background: var(--panel2); color: var(--ink2); }

/* Panel de tienda */
.adm { display: flex; flex-wrap: wrap; min-height: calc(100vh - 50px); }
.adm-side { flex: 1 1 220px; max-width: 250px; background: var(--panel); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 18px; }
.adm-side nav { display: flex; flex-direction: column; gap: 2px; }
.adm-side nav button { text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 10px 12px; min-height: 42px; color: var(--ink2); display: flex; justify-content: space-between; align-items: center; }
.adm-side nav button[aria-current="page"] { background: var(--panel2); color: var(--ink); font-weight: 600; }
.adm-main { flex: 999 1 640px; min-width: 0; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 64px 28px; display: flex; flex-direction: column; gap: 20px; }
.adm-main > .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.adm-main h1 { font-size: 30px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.kpi span { font-size: 13px; color: var(--ink2); }
.kpi strong { display: block; font-family: var(--f-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.qty-inp { width: 76px; min-height: 36px; text-align: center; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.thumb { width: 34px; height: 47px; border-radius: 4px; flex: none; position: relative; overflow: hidden; }
.split { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.split > .a { flex: 1 1 360px; max-width: 460px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.split > .b { flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-height: 42px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); font-weight: 600; padding: 0 12px; }
.seg button[aria-pressed="true"] { border-color: var(--ink); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--line); }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.sec-row { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 10px; border: 1px solid var(--line); border-radius: 10px; }
.switch { width: 46px; height: 28px; border-radius: 999px; border: 0; background: #B9BCC3; padding: 3px; display: flex; flex: none; }
.switch[aria-pressed="true"] { background: var(--brand); justify-content: flex-end; }
.switch span { width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px #0004; }
.icon-btn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; justify-content: center; }
.order { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.order > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.order > summary::-webkit-details-marker { display: none; }
.order .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.doubt { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.doubt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.opt { text-align: left; padding: 8px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
.opt[aria-pressed="true"] { border-color: var(--ink); }
.opt .cimg { width: 100%; }

/* Imagen de carta: imagen real de Scryfall cuando hay conexión; silueta de color si no. */
.cimg { position: relative; aspect-ratio: 63 / 88; max-width: 100%; border-radius: 4.75% / 3.4%; overflow: hidden; background: var(--fr); }
.cimg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
.cfb { position: absolute; inset: 0; padding: 6%; display: flex; flex-direction: column; gap: 4%; }
.cfb .n { background: var(--bar); color: var(--cink); border-radius: 3px; padding: 2px 5px; font-size: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cfb .art { flex: 1.3; background: var(--art); border-radius: 2px; }
.cfb .t { background: var(--bar); color: var(--cink); border-radius: 3px; padding: 1px 5px; font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cfb .tx { flex: 1; background: var(--bar); border-radius: 2px; opacity: .85; }
.thumb .cfb { padding: 3px; gap: 2px; } .thumb .cfb .n, .thumb .cfb .t { display: none; }
.foil-tag { position: absolute; z-index: 3; right: 6px; bottom: 6px; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #FFFFFFE8; color: #15171C; letter-spacing: .05em; }

/* ===== Tienda pública (usa los colores de cada tienda) ===== */
.st { background: var(--s-bg); color: var(--s-text); min-height: calc(100vh - 50px); color-scheme: var(--s-scheme); }
.st a { color: var(--s-accent-text); }
.st .s-head { background: var(--s-head); border-bottom: 1px solid var(--s-border); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.st .s-head .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding-block: 14px; }
.st .brandlink { display: flex; align-items: center; gap: 12px; background: none; border: 0; color: var(--s-text); padding: 0; text-align: left; }
.st .brandlink strong { font-family: var(--f-display); font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
.st .search { flex: 1 1 280px; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: var(--s-surface2); border: 1px solid var(--s-border); }
.st .search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; min-height: 42px; color: var(--s-text); }
.st .search input::placeholder { color: var(--s-muted); }
.st .sbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--s-border); background: transparent; color: var(--s-text); font-weight: 600; }
.st .sbtn.acc { background: var(--s-accent); color: var(--s-on-accent); border-color: var(--s-accent); }
.st .sbtn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 8px; }
.st .sbtn[disabled] { opacity: .45; cursor: not-allowed; }
.st .tabs { display: flex; flex-wrap: wrap; gap: 2px; }
.st .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--s-muted); min-height: 44px; }
.st .tabs button[aria-current="page"] { color: var(--s-text); border-bottom-color: var(--s-accent); font-weight: 600; }
.st main { padding-block: 28px 64px; display: flex; flex-direction: column; gap: 40px; }
.st .panel { background: var(--s-surface); border: 1px solid var(--s-border); border-radius: 16px; padding: 24px; }
.st .muted { color: var(--s-muted); }
.st h2 { font-size: 26px; }
.st .eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--s-accent-text); }
.st .hero { display: flex; flex-wrap: wrap; gap: 20px; }
.st .hero .main { flex: 999 1 520px; min-width: 0; padding: 40px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.st .hero h1 { font-size: clamp(30px, 4.4vw, 46px); font-weight: 800; max-width: 640px; }
.st .hero .side { flex: 1 1 280px; display: flex; flex-direction: column; gap: 10px; }
.st .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 18px; }
.st .tile { background: var(--s-surface); border: 1px solid var(--s-border); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 10px; text-align: left; color: var(--s-text); }
.st .tile .open { background: none; border: 0; padding: 0; color: inherit; text-align: left; display: flex; flex-direction: column; gap: 10px; }
.st .tile h3 { font-family: var(--f-body); font-size: 15px; font-weight: 600; letter-spacing: 0; line-height: 1.3; }
.st .code { font-family: var(--f-mono); font-size: 12px; color: var(--s-muted); }
.st .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.st .tag { font-family: var(--f-mono); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: var(--s-surface2); color: var(--s-text); }
.st .price { font-family: var(--f-mono); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.st .list { background: var(--s-surface); border: 1px solid var(--s-border); border-radius: 14px; overflow: hidden; }
.st .lrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; border-bottom: 1px solid var(--s-border); }
.st .lrow:last-child { border-bottom: 0; }
.st .lrow .nm { flex: 1 1 200px; min-width: 0; background: none; border: 0; padding: 0; text-align: left; color: var(--s-text); display: flex; flex-direction: column; }
.st .filters { display: flex; flex-direction: column; gap: 14px; }
.st .chip { min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--s-border); background: var(--s-surface2); color: var(--s-text); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
.st .chip[aria-pressed="true"] { background: var(--s-accent); color: var(--s-on-accent); border-color: var(--s-accent); }
.st .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #0005; }
.st .sel { min-height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--s-border); background: var(--s-surface2); color: var(--s-text); }
.st .flabel { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--s-muted); }
.st .fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; }
.st .empty { padding: 36px; text-align: center; color: var(--s-muted); background: var(--s-surface); border: 1px dashed var(--s-border); border-radius: 14px; }
.st .foot { border-top: 1px solid var(--s-border); background: var(--s-head); }
.st .foot .wrap { display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; padding-block: 28px; font-size: 14px; color: var(--s-muted); }
.st .cart-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 0; border-bottom: 1px solid var(--s-border); }
.st .stepper { display: inline-flex; align-items: center; border: 1px solid var(--s-border); border-radius: 10px; }
.st .stepper button { width: 40px; height: 40px; border: 0; background: none; color: var(--s-text); font-size: 18px; }
.st .stepper span { min-width: 28px; text-align: center; font-weight: 600; }
.st .status { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--s-surface2); }

/* Modal */
.ov { position: fixed; inset: 0; background: #0009; z-index: 50; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
.dlg { width: min(960px, 100%); border-radius: 18px; position: relative; }
.dlg.sm { width: min(460px, 100%); }
.dlg .x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; font-size: 22px; line-height: 1; }
.dlg.plat { background: var(--panel); color: var(--ink); padding: 24px; border: 1px solid var(--line); }
.dlg.plat .x { background: var(--panel2); color: var(--ink); }
.dlg.st { min-height: 0; }
.dlg.store { background: var(--s-surface); color: var(--s-text); padding: 28px; border: 1px solid var(--s-border); }
.dlg.store .x { background: var(--s-surface2); color: var(--s-text); }
.detail { display: flex; flex-wrap: wrap; gap: 28px; }
.detail .pic { flex: 1 1 260px; max-width: 340px; }
.detail .info { flex: 999 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.detail h3.lbl { font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--s-muted); }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.vbtn { text-align: left; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--s-border); background: var(--s-surface2); color: var(--s-text); display: flex; flex-direction: column; }
.vbtn[aria-pressed="true"] { border-color: var(--s-accent); }
.condlist { border: 1px solid var(--s-border); border-radius: 12px; overflow: hidden; }
.condrow { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border: 0; border-bottom: 1px solid var(--s-border); background: var(--s-surface); color: var(--s-text); text-align: left; }
.condrow:last-child { border-bottom: 0; }
.condrow[aria-pressed="true"] { background: var(--s-surface2); box-shadow: inset 3px 0 0 var(--s-accent); }
.condrow[disabled] { color: var(--s-muted); cursor: not-allowed; }
.dlg .addbox { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px; border-radius: 12px; background: var(--s-surface2); }

/* Buscador del alta manual */
.sugg { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sugg button { text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--panel); padding: 10px 12px; min-height: 44px; }
.sugg button:last-child { border-bottom: 0; }
.sugg button:hover { background: var(--panel2); }
.printgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; max-height: 420px; overflow-y: auto; padding: 2px; }

/* Encabezado de administración de la plataforma */

/* Banners y eventos en el panel */
.bn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }

.bn-prev img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* Eventos en la tienda */
.evgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }

.ev.feat { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; }

/* Ficha de carta: versiones bajo la imagen y texto de la carta */
.vers { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.vmini { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; }
.vm { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 8px; border: 2px solid var(--s-border); background: var(--s-surface2); color: var(--s-text); text-align: left; font-size: 11px; line-height: 1.25; min-height: 44px; }

.manacost { display: inline-flex; gap: 2px; flex: none; margin-top: 6px; }
.sym { display: inline-flex; align-items: center; justify-content: center; min-width: 19px; height: 19px; padding: 0 3px; border-radius: 10px; font-family: var(--f-mono); font-size: 11px; font-weight: 600; background: #CAC5BE; color: #17181C; vertical-align: 1px; margin: 0 1px; }
.sym.W { background: #F3EBC9; } .sym.U { background: #A9CCEB; } .sym.B { background: #BDB4B9; } .sym.R { background: #EFA58E; } .sym.G { background: #9FCFA9; }

/* Otros productos */
.pimg { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--s-surface2); }
.pimg img, .pthumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.pph span { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--s-muted, var(--ink2)); }
.pthumb { width: 40px; height: 40px; border-radius: 6px; background: var(--s-surface2, var(--panel2)); }

.pdesc { margin: 0; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.st .pgrid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
/* Ganancia general y precio fijo */

/* Marca en el encabezado */

.blogo { display: block; max-width: 240px; width: auto; object-fit: contain; }
.bword { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; line-height: 1; color: var(--s-text); }
.bword .w1 { color: var(--s-accent-text); }
.st .eyebrow { color: var(--s-accent2); }
.ev-date { color: var(--s-accent2); }
/* Opciones de logotipo y paletas */
.logoopts { display: grid; grid-template-columns: 1fr; gap: 8px; }
.logoopt { text-align: left; border: 2px solid var(--line); border-radius: 12px; background: var(--panel); padding: 8px; display: flex; flex-direction: column; gap: 8px; color: var(--ink); }
.logoopt[aria-pressed="true"] { border-color: var(--ink); }
.logoopt-prev { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 8px; background: var(--s-head); min-height: 64px; overflow: hidden; }
.logoopt .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink2); flex: none; margin-top: 2px; }
.logoopt[aria-pressed="true"] .radio { border-color: var(--ink); box-shadow: inset 0 0 0 4px var(--panel); background: var(--ink); }
.palgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.palopt { text-align: left; border: 2px solid var(--line); border-radius: 12px; background: var(--panel); padding: 8px; display: flex; flex-direction: column; gap: 8px; color: var(--ink); font-size: 14px; }

/* Formatos en la ficha de carta */

.fmt.off { background: transparent; color: var(--s-muted); border-color: var(--s-border); opacity: .6; text-decoration: line-through; text-decoration-thickness: 1px; }
/* Filtros del inventario */
.invf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; align-items: end; }

/* Pedidos */

.osum > div { background: var(--panel2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; }

/* Comprador: detalle de compra y aviso de apartado */

.st .btbl th { text-align: left; font-size: 12px; color: var(--s-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--s-border); }

/* Eventos como imágenes */
.flygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.fly { padding: 0; border: 1px solid var(--s-border); border-radius: 14px; overflow: hidden; background: var(--s-surface); display: block; }
.fly img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }

.flyer-dlg { width: min(560px, 100%); padding: 16px; }
.flyer-dlg img { display: block; width: 100%; border-radius: 10px; }
.evadm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.evadm { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.evadm-pic { padding: 0; border: 0; background: var(--panel2); display: block; }
.evadm-pic img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.slide .cap-btn { position: absolute; left: 20px; bottom: 18px; z-index: 2; }

/* Ronda 5 */
.catchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 14px; min-height: 34px; }
.catchip:not(:has(.catx)) { padding-right: 12px; }

.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; overflow: hidden; flex: none; background: var(--s-accent, var(--brand)); color: var(--s-on-accent, var(--on-brand)); font-family: var(--f-display); font-weight: 800; }

.cd { font-family: var(--f-mono); font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--s-surface2, var(--panel2)); color: var(--s-accent2, var(--warn)); white-space: nowrap; }

.dlg.store.sm { width: min(480px, 100%); }
.st input.sel { padding: 0 12px; width: 100%; }

/* Ronda 8: botones de regresar y separadores del menú */

.wwho td { white-space: nowrap; }
.wwho .linkbtn { text-align: left; }
.wside { flex: 1 1 280px; max-width: 360px; position: sticky; top: 16px; }
.buylist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.buylist li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
@media (max-width: 900px) { .wside { position: static; max-width: none; } }

/* Ronda 11 */
@media (min-width: 721px) {
  .adm { align-items: flex-start; }
  .adm-side { position: sticky; top: 0; height: 100vh; overflow-y: auto; box-sizing: border-box; overscroll-behavior: contain; }
}
.adm-side nav button { min-height: 38px; padding: 8px 12px; }
.tcline { display: grid; grid-template-columns: minmax(0, 1fr) 104px 84px; gap: 8px; align-items: center; padding: 4px 0; }
.tcline .tcname { min-width: 0; overflow-wrap: anywhere; }
.tcline .tcname s { font-size: 12px; }
.tcprice { display: flex; align-items: center; gap: 4px; color: var(--ink2); }
.tcprice input { width: 100%; min-height: 36px; padding: 4px 8px; text-align: right; }
.tcline .num { text-align: right; }

.tile.is-out img, .tile.is-out .cardimg, .lrow.is-out .thumb { filter: grayscale(.85); opacity: .7; }
.tag.out { background: transparent; border: 1px solid currentColor; opacity: .85; }

.dsel { min-height: 36px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; max-width: 150px; }
.printgrid .opt[hidden] { display: none !important; }
.st .s-head .logo{width:62px!important;height:62px!important;border-radius:50%!important;background:#FFF4E5!important;padding:5px;box-shadow:0 0 0 2px #15211F}
.st .s-head .bname{font-size:23px!important}
[data-act="adminLogout"]{display:none!important}
</style>
</head>

function storeUrl(s) { return "tuplataforma.com/tienda/" + s.slug; }

function payState(s, month) {
  var paid = paidFor(s.id, month);

  return { cls: "bad", label: "Pendiente", paid: 0 };
}

    '<div class="kpis"><div class="kpi"><span>Cobrado en ' + esc(monthLabel(m).toLowerCase()) + "</span><strong>" + money(total) + '</strong></div><div class="kpi"><span>Tiendas que faltan</span><strong style="color:' + (missing.length ? "var(--bad)" : "var(--ok)") + '">' + missing.length + "</strong></div></div>" +
    (missing.length ? '<p class="pill bad" style="align-self:flex-start;white-space:normal;border-radius:8px;padding:8px 12px">Faltan: ' + missing.map(function (s) { return esc(s.name); }).join(", ") + "</p>" : '<p class="pill ok" style="align-self:flex-start">Todas las tiendas activas están al corriente</p>') +

function runProdImport(text, fileName) {
  var s = curStore(), rows = parseCSV(text || "");
  if (rows.length < 2) { ui.impP = { text: text, error: "No encontramos filas. Revisa que el archivo tenga encabezados y al menos un producto." }; return; }
  var head = rows[0].map(norm);
  function col(names) { return head.findIndex(function (h) { return names.indexOf(h) >= 0; }); }
  var ix = { name: col(["nombre", "name", "producto"]), cat: col(["categoria", "category", "tipo"]), price: col(["precio", "price"]), qty: col(["cantidad", "quantity", "qty", "stock"]), desc: col(["descripcion", "description", "notas"]) };
  if (ix.name < 0) { ui.impP = { text: text, error: "Falta la columna «nombre»." }; return; }
  var existing = prodsOf(s.id);
  ui.impP = { text: text, fileName: fileName, rows: rows.slice(1).map(function (r, n) {
    function g(i) { return i >= 0 ? String(r[i] || "").trim() : ""; }
    var row = { line: n + 2, name: g(ix.name), category: g(ix.cat) || "Otro", price: parseFloat(g(ix.price).replace(/[$,\s]/g, "")), qty: parseInt(g(ix.qty), 10), desc: g(ix.desc), ok: false };
    if (!row.name) row.reason = "Falta el nombre.";
    else if (!(row.price > 0)) row.reason = "Falta el precio.";
    else if (!(row.qty >= 0) || g(ix.qty) === "") row.reason = "Falta la cantidad.";
    else { row.ok = true; row.exists = existing.some(function (p) { return norm(p.name) === norm(row.name); }); }
    return row;
  }) };
}

/* ----- Acciones ----- */
function tabOf(id) { return (db.tabs || []).filter(function (t) { return t.id === id; })[0]; }
function curTab() { return tabOf(ui.tabId); }
function restockLine(l, sign) {
  if (l.kind === "int") { var x = intById(l.refId); if (x) x.qty += sign * l.qty; }
  else if (l.kind === "card") { var it = db.inventory.filter(function (i) { return i.id === l.refId; })[0]; if (it) it.qty += sign * l.qty; }
  else if (l.kind === "prod") { var p = prodById(l.refId); if (p) p.qty += sign * l.qty; }
}
function addTabLine(t, kind, refId, name, unit, qty) {
  var ex = t.lines.filter(function (l) { return l.kind === kind && l.refId === refId && l.unit === unit && (kind !== "other" || l.name === name); })[0];
  if (ex) { ex.qty += qty; ex.at = Date.now(); } else t.lines.push({ id: uid("ln"), kind: kind, refId: refId, name: name, unit: unit, qty: qty, at: Date.now() });
}

/* Los pedidos nuevos descuentan inventario cuando el panel los recibe. */

      else { var it = db.inventory.filter(function (x) { return x.id === i.invId; })[0]; if (it) it.qty = Math.max(0, Number(it.qty) - i.qty); }

    if (e && (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request")) { FB.then = null; return; }

}
function fbRunThen() {

var _fbPlaceOrder = placeOrder;
placeOrder = function (note) {
  var s = curStore(), lines = cartLines(s);
  if (!db.buyer || !FB.user) { FB.then = { act: "checkout", note: note }; fbSignIn(); return; }

  var items = lines.map(function (x) {

    return { invId: x.it.id, printId: x.it.printId, finish: x.it.finish, cond: x.it.cond, lang: x.it.lang || "EN", qty: x.line.qty, unit: x.unit };
  });

  fdb.runTransaction(function (tx) {

    o.total = items.reduce(function (a, i) { return a + i.unit * i.qty; }, 0);

};

/* ---- Arranque ---- */
function fbLoad(cb) {
  var files = ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js"], i = 0;
  (function next() {
    if (i >= files.length) return cb();
    var sc = document.createElement("script"); sc.src = FB_SDK + files[i++]; sc.onload = next;

    document.head.appendChild(sc);

}

/* ---- Recuperación: cartas que tenía la tienda el 29 de octubre (lista guardada en GitHub por la tarea de precios) ---- */
var REC = { state: "idle", ids: [], prints: null, err: null, done: 0 };
var REC_URLS = [
  "https://raw.githubusercontent.com/gacostatche-coder/nekogames/c5a0d8d9245077602c57ce481be01e40e43c5710/ck-precios.json",
  "recuperacion-29oct.json"
];
function recSfids() {
  var s = curStore(), have = {};
  (db.inventory || []).forEach(function (i) { if (i.storeId !== s.id) return; var p = db.catalog[i.printId]; var sid = p && (p.scryfallId || (/^[0-9a-f]{8}-[0-9a-f]{4}-/.test(p.id) ? p.id : null)); if (sid) have[sid] = 1; });
  return REC.ids.filter(function (id) { return !have[id]; });
}
function recLoad() {
  if (REC.state !== "idle") return;
  REC.state = "loading";
  (function tryUrl(i) {
    if (i >= REC_URLS.length) { REC.state = "none"; render(); return; }
    fetch(REC_URLS[i], { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { REC.ids = d.revisadas || []; REC.state = "ready"; render(); })
      .catch(function () { tryUrl(i + 1); });
  })(0);
}
/* Trae de Scryfall los datos de cada carta faltante, de 75 en 75. */
function recFetchPrints(ids) {
  var out = [], chunks = [];
  for (var i = 0; i < ids.length; i += 75) chunks.push(ids.slice(i, i + 75));
  REC.done = 0;
  return chunks.reduce(function (pr, ch) {
    return pr.then(function () {
      return sfFetch("https://api.scryfall.com/cards/collection", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ identifiers: ch.map(function (id) { return { id: id }; }) }) })
        .then(function (res) { (res.data || []).forEach(function (c) { out.push(fromScryfall(c)); }); REC.done += ch.length; var el = document.getElementById("rec-prog"); if (el) el.textContent = "Consultando Scryfall… " + REC.done + " de " + ids.length; })
        .then(function () { return new Promise(function (ok) { setTimeout(ok, 120); }); });
    });
  }, Promise.resolve()).then(function () { return out; });
}
function recCardHTML() {
  recLoad();
  if (REC.state === "none" || REC.state === "idle") return "";
  if (REC.state === "loading") return '<div class="card"><p class="muted" style="margin:0">Buscando la lista de recuperación…</p></div>';
  var miss = recSfids();
  if (!miss.length) return '<div class="card stack"><h2 style="font-size:18px">Recuperación del 29 de octubre</h2><p class="muted" style="margin:0">Todas las cartas de la lista (' + REC.ids.length + ') ya están en tu inventario.</p></div>';
  var busy = REC.state === "working";
  return '<div class="card stack" style="border:2px solid var(--brand)"><h2 style="font-size:18px">Recuperar cartas del 29 de octubre</h2>' +
    '<p style="margin:0">Hay <strong>' + miss.length + '</strong> cartas que la tienda tenía el 29 de octubre y ya no están en el inventario. Sabemos qué carta y qué versión eran, pero no la cantidad, la condición ni si eran foil.</p>' +
    '<ol style="margin:0;padding-left:20px;line-height:1.6"><li><strong>Descargar Excel para llenar:</strong> baja la lista con nombre, set y número. Llena cantidad, condición, foil e idioma y cárgala aquí abajo.</li>' +
    '<li><strong>Agregar todas con existencia 0:</strong> las da de alta de inmediato (Normal, NM, inglés) para que tus clientes las encuentren. Después ajustas cantidades en el inventario.</li></ol>' +
    (REC.err ? '<p class="pill bad" style="white-space:normal;border-radius:8px;margin:0">' + esc(REC.err) + "</p>" : "") +
    (busy ? '<p class="muted" id="rec-prog" style="margin:0">Consultando Scryfall…</p>' :
      '<div class="row" style="gap:8px"><button type="button" class="btn pri" data-act="recCsv">Descargar Excel para llenar</button><button type="button" class="btn" data-act="recAddZero">Agregar todas con existencia 0</button></div>') +
    "</div>";
}
function recRun(then) {
  var miss = recSfids(); if (!miss.length) return;
  REC.state = "working"; REC.err = null; render();
  recFetchPrints(miss).then(function (prints) {
    REC.state = "ready";
    if (!prints.length) { REC.err = "No se pudo consultar Scryfall. Revisa tu conexión e inténtalo otra vez."; render(); return; }
    then(prints); render();
  }).catch(function () { REC.state = "ready"; REC.err = "No se pudo consultar Scryfall. Revisa tu conexión e inténtalo otra vez."; render(); });
}
Object.assign(ACT, {
  recCsv: function () {
    recRun(function (prints) {
      var q = function (v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
      prints.forEach(function (p) { addToCatalog(p); });
      var rows = ["nombre,set,numero,foil,condicion,idioma,cantidad,precio_fijo,precio,scryfall_id"].concat(prints.sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (p) {
        return [p.name, p.set, p.num, "", "NM", "EN", "", "", "", p.id].map(q).join(",");
      }));
      var blob = new Blob(["﻿" + rows.join("\n")], { type: "text/csv;charset=utf-8" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "recuperacion-neko-games.csv"; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast("Lista descargada: " + prints.length + " cartas. Llena cantidad y condición y cárgala aquí.");
    });
  },
  recAddZero: function () {
    recRun(function (prints) {
      var s = curStore(), n = 0;
      prints.forEach(function (p) { var c = addToCatalog(p); var fin = c.finishes.indexOf("normal") >= 0 ? "normal" : c.finishes[0]; addInventory(s, c.id, fin, "NM", "EN", 0, null); n++; });
      auditLog(s.id, "Inventario", "Recuperó " + n + " cartas del 29 de octubre con existencia 0", "");
      saveDB(); toast(n + " cartas agregadas con existencia 0. Ajusta las cantidades en Inventario de cartas.");
    });
  }
});
if (typeof admImportWrap === "function") {
  var _recImport = admImportWrap;
  admImportWrap = function (s) { return recCardHTML() + _recImport(s); };
}

saveDB();
applyRoute();
